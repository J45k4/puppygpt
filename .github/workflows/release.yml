name: Signed release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (for example v0.0.1)
        required: true
        type: string
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [linux-x64, linux-arm64, darwin-x64, darwin-arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: bun -e 'import p from "./package.json"; import { versionParts } from "./src/update/protocol"; versionParts(process.env.RELEASE_TAG!); if (process.env.RELEASE_TAG !== `v${p.version}`) throw new Error("Tag must match package.json version")'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test src
      - name: Compile application and embedded frontend
        env:
          TARGET: ${{ matrix.target }}
        run: bun build --compile --minify --target="bun-$TARGET" src/launcher.ts --outfile="release/puppygpt-$TARGET"
      - uses: actions/upload-artifact@v4
        with:
          name: puppygpt-${{ matrix.target }}
          path: release/puppygpt-*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: puppygpt-*
          path: release
          merge-multiple: true
      - name: Sign release manifest
        env:
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: bun scripts/release.ts "$RELEASE_TAG" release/puppygpt-*
      - name: Include service installer
        run: install -m 755 install.sh release/install.sh
      - name: Publish signed binaries
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/puppygpt-* release/manifest.json release/manifest.sig release/install.sh --verify-tag --generate-notes
